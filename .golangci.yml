version: "2"

linters:
  default: standard
  enable:
    - copyloopvar
    - durationcheck
    - errorlint
    - forcetypeassert
    - godot
    - misspell
    - modernize
    - nilerr
    - predeclared
    - revive
    - unconvert
    - unparam
  settings:
    misspell:
      locale: US
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: error-strings
  exclusions:
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - forcetypeassert
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/mittwald/cli-kit
