version: "2"

linters:
  default: standard
  enable:
    - copyloopvar
    - durationcheck
    - errorlint
    - forcetypeassert
    - godot
    - gosec
    - misspell
    - modernize
    - nilerr
    - predeclared
    - revive
    - unconvert
    - unparam
  settings:
    misspell:
      locale: US
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: error-strings
  exclusions:
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - forcetypeassert
          - unparam
      # Tests re-execute their own binary to check signal handling, and
      # create files with the exact modes the code under test must handle.
      - path: _test\.go
        linters:
          - gosec
        text: "G204|G302|G306|G702"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/mittwald/cli-kit
